<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GSAP Landing Page</title>

    <style>
      body {
        margin: 0;
        font-family: "Arial", sans-serif;
        overflow-x: hidden;
      }

      /* HERO SECTION */
      .hero {
        height: 100vh;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 10%;
        background: #0f172a;
        color: white;
      }

      .left {
        max-width: 500px;
      }

      .left h1 {
        font-size: 50px;
        margin-bottom: 20px;
        opacity: 0;
      }

      .left p {
        font-size: 18px;
        margin-bottom: 30px;
        opacity: 0;
      }

      .btn {
        padding: 12px 25px;
        background: #38bdf8;
        border: none;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
        opacity: 0;
      }

      .right img {
        width: 400px;
        opacity: 0;
      }

      /* SECOND SECTION */
      .section2 {
        height: 100vh;
        background: #f1f5f9;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        width: 200px;
        height: 200px;
        background: #0ea5e9;
        margin: 20px;
        border-radius: 10px;
        opacity: 0;
      }
    </style>
  </head>

  <body>
    <!-- HERO -->
    <section class="hero">
      <div class="left">
        <h1 class="title">Build Amazing Websites 🚀</h1>
        <p class="desc">
          Learn GSAP animations and make your UI modern and interactive.
        </p>
        <button class="btn">Get Started</button>
      </div>

      <div class="right">
        <img src="https://via.placeholder.com/400" class="hero-img" />
      </div>
    </section>

    <!-- SECOND SECTION -->
    <section class="section2">
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </section>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      // HERO ANIMATION (timeline for smooth sequence)
      const tl = gsap.timeline();

      tl.to(".title", {
        y: 0,
        opacity: 1,
        duration: 1,
      })
        .to(
          ".desc",
          {
            y: 0,
            opacity: 1,
            duration: 1,
          },
          "-=0.5",
        )
        .to(
          ".btn",
          {
            y: 0,
            opacity: 1,
            duration: 1,
          },
          "-=0.5",
        )
        .to(
          ".hero-img",
          {
            x: 0,
            opacity: 1,
            duration: 1.5,
          },
          "-=1",
        );

      // INITIAL POSITIONS
      gsap.set(".title", { y: 50 });
      gsap.set(".desc", { y: 50 });
      gsap.set(".btn", { y: 50 });
      gsap.set(".hero-img", { x: 100 });

      // SCROLL ANIMATION (cards)
      gsap.to(".card", {
        scrollTrigger: {
          trigger: ".section2",
          start: "top 80%",
        },
        y: 0,
        opacity: 1,
        duration: 1,
        stagger: 0.3,
      });

      gsap.set(".card", { y: 100 });
    </script>
  </body>
</html>
